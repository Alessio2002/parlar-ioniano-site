<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Integrity Check – Parlar Ioniano</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: system-ui, sans-serif;
      }
      .check-card {
        border-radius: 8px;
        border: 1px solid #1a4a84;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .result-box {
        padding: 1rem;
        border-radius: 6px;
        margin-top: 1rem;
        font-weight: bold;
      }
      .success {
        background-color: #d1e7dd;
        color: #0f5132;
      }
      .error {
        background-color: #f8d7da;
        color: #842029;
      }
    </style>
  </head>
  <body>
    <div class="check-card">
      <h2 style="color: #1a4a84">Parlar Ioniano – Data Integrity Suite</h2>
      <p class="text-muted">
        Verifying structural integrity and key shapes for
        <code>words.json</code> and <code>phrases.json</code>.
      </p>
      <button class="btn btn-primary fw-bold px-4 py-2" id="runCheckBtn">
        Run Data Check
      </button>
      <div id="checkResults" class="mt-3"></div>
    </div>

    <script>
      async function fetchWithFallback(filename) {
        const paths = [
          `../data/${filename}`,
          `data/${filename}`,
          `./${filename}`,
        ];
        for (const path of paths) {
          try {
            const res = await fetch(path);
            if (res.ok) return await res.json();
          } catch (e) {}
        }
        throw new Error(`HTTP 404 loading ${filename}`);
      }

      document
        .getElementById("runCheckBtn")
        .addEventListener("click", async () => {
          const resultsEl = document.getElementById("checkResults");
          resultsEl.innerHTML = `<div class="spinner-border text-primary" role="status"></div> Checking datasets...`;

          let logs = [];
          let hasError = false;

          try {
            const data = await fetchWithFallback("words.json");
            if (!data.words || !Array.isArray(data.words)) {
              throw new Error("words.json missing 'words' array root key.");
            }
            let invalidCount = 0;
            data.words.forEach((item) => {
              if (
                !item.ionian ||
                !item.english ||
                !item.ipa ||
                item.notes === undefined
              ) {
                invalidCount++;
              }
            });
            if (invalidCount > 0) {
              throw new Error(
                `${invalidCount} word entry/entries failed the four-key shape (ionian, english, ipa, notes).`
              );
            }
            logs.push(
              `✅ <strong>words.json</strong>: Loaded successfully (${data.words.length} items verified with four-key shape).`
            );
          } catch (err) {
            hasError = true;
            logs.push(`❌ <strong>words.json Error</strong>: ${err.message}`);
          }

          try {
            const data = await fetchWithFallback("phrases.json");
            if (!data.dialogues || !Array.isArray(data.dialogues)) {
              throw new Error(
                "phrases.json missing 'dialogues' array root key."
              );
            }
            let totalTurns = 0;
            let hasComingLater = false;
            data.dialogues.forEach((d) => {
              if (d.turns && Array.isArray(d.turns))
                totalTurns += d.turns.length;
              if (
                d.status === "coming later" ||
                (d.pages && d.pages === "57-58")
              ) {
                hasComingLater = true;
              }
            });
            if (!hasComingLater) {
              throw new Error(
                "phrases.json missing 'coming later' entry for pages 57-58."
              );
            }
            logs.push(
              `✅ <strong>phrases.json</strong>: Loaded successfully (${data.dialogues.length} sections / ${totalTurns} ordered turns verified, 'coming later' entry present for pages 57–58).`
            );
          } catch (err) {
            hasError = true;
            logs.push(`❌ <strong>phrases.json Error</strong>: ${err.message}`);
          }

          resultsEl.innerHTML = `
          <div class="result-box ${hasError ? "error" : "success"}">
            ${logs.join("<br>")}
          </div>
        `;
        });
    </script>
  </body>
</html>
