<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary & Phrasebook – Parlar Ioniano</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="p-3">
    <main class="container my-2 mb-5">
      <h1 class="mb-3 text-primary">Vocabulary & Phrasebook Hub</h1>
      <p class="text-muted mb-4">
        Explore the Ionian lexicon cards and Chapter 1 dialogues under one
        unified tab.
      </p>

      <!-- Bootstrap Navigation Tabs -->
      <ul class="nav nav-tabs mb-4" id="vocabTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active fw-bold"
            id="words-tab"
            data-bs-toggle="tab"
            data-bs-target="#words-pane"
            type="button"
            role="tab"
            aria-controls="words-pane"
            aria-selected="true"
          >
            Basic Vocabulary (Page 12)
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link fw-bold"
            id="phrases-tab"
            data-bs-toggle="tab"
            data-bs-target="#phrases-pane"
            type="button"
            role="tab"
            aria-controls="phrases-pane"
            aria-selected="false"
          >
            Chapter 1 Dialogues (Pages 51–58)
          </button>
        </li>
      </ul>

      <!-- Tab Content Panes -->
      <div class="tab-content" id="vocabTabContent">
        <!-- Tab 1: Basic Vocabulary Pane -->
        <div
          class="tab-pane fade show active"
          id="words-pane"
          role="tabpanel"
          aria-labelledby="words-tab"
        >
          <div class="card mb-4 p-3 shadow-sm border-primary bg-light">
            <label for="wordSearch" class="form-label fw-bold text-primary"
              >Filter Vocabulary Words:</label
            >
            <input
              type="text"
              id="wordSearch"
              class="form-control"
              placeholder="Type to filter words, translations, or notes..."
            />
            <div
              id="wordMatchCount"
              class="form-text mt-2 fw-semibold"
              aria-live="polite"
            ></div>
          </div>

          <div id="wordsGrid" class="row row-cols-1 row-cols-md-3 g-3">
            <div class="col-12">
              <div class="spinner-border text-primary" role="status"></div>
              Loading vocabulary from <code>data-json/data/words.json</code>...
            </div>
          </div>
        </div>

        <!-- Tab 2: Chapter 1 Dialogues Pane -->
        <div
          class="tab-pane fade"
          id="phrases-pane"
          role="tabpanel"
          aria-labelledby="phrases-tab"
        >
          <div class="card mb-4 p-3 shadow-sm bg-light">
            <label class="form-label fw-bold">Dialogue Display Mode:</label>
            <div class="btn-group" role="group">
              <input
                type="radio"
                class="btn-check"
                name="phraseLang"
                id="pBoth"
                value="both"
                checked
              />
              <label class="btn btn-outline-primary" for="pBoth">Both</label>

              <input
                type="radio"
                class="btn-check"
                name="phraseLang"
                id="pIonian"
                value="ionian"
              />
              <label class="btn btn-outline-primary" for="pIonian"
                >Ionian Only</label
              >

              <input
                type="radio"
                class="btn-check"
                name="phraseLang"
                id="pEnglish"
                value="english"
              />
              <label class="btn btn-outline-primary" for="pEnglish"
                >English Only</label
              >
            </div>
          </div>

          <div id="phrasesContainer">
            <div class="spinner-border text-primary" role="status"></div>
            Loading dialogues from <code>data-json/data/phrases.json</code>...
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let wordsData = [];
      let dialoguesData = [];
      let phraseMode = "both";

      async function fetchWithFallback(filename) {
        const paths = [
          `data-json/data/${filename}`,
          `./data-json/data/${filename}`,
          `data/${filename}`,
          `./data/${filename}`,
        ];
        for (const path of paths) {
          try {
            const res = await fetch(path);
            if (res.ok) return await res.json();
          } catch (e) {}
        }
        throw new Error(`Unable to fetch ${filename}`);
      }

      async function initializeHub() {
        try {
          const wJson = await fetchWithFallback("words.json");
          wordsData = wJson.words || [];
          renderWords(wordsData);
        } catch (err) {
          document.getElementById("wordsGrid").innerHTML = `
            <div class="alert alert-danger col-12">
              Failed to load <code>words.json</code>. Ensure a local server is running.
            </div>`;
        }

        try {
          const pJson = await fetchWithFallback("phrases.json");
          dialoguesData = pJson.dialogues || [];
          renderPhrases();
        } catch (err) {
          document.getElementById("phrasesContainer").innerHTML = `
            <div class="alert alert-danger">
              Failed to load <code>phrases.json</code>. Ensure a local server is running.
            </div>`;
        }
      }

      function renderWords(list) {
        const grid = document.getElementById("wordsGrid");
        const count = document.getElementById("wordMatchCount");
        grid.innerHTML = "";

        if (list.length === 0) {
          grid.innerHTML = `<div class="alert alert-warning col-12">No matching words found.</div>`;
          count.textContent = "Showing 0 words.";
          return;
        }

        list.forEach((w) => {
          const col = document.createElement("div");
          col.className = "col";
          const card = document.createElement("div");
          card.className = "card h-100 shadow-sm border-secondary";
          const body = document.createElement("div");
          body.className = "card-body d-flex flex-column";

          const title = document.createElement("h5");
          title.className = "card-title text-primary fw-bold";
          title.textContent = w.ionian;

          const sub = document.createElement("h6");
          sub.className = "card-subtitle mb-2 text-muted small";
          sub.textContent = w.notes || "Vocabulary Item";

          const p = document.createElement("p");
          p.className = "card-text mb-1";
          const strong = document.createElement("strong");
          strong.textContent = "Translation: ";
          p.appendChild(strong);
          const span = document.createElement("span");
          span.textContent = w.english;
          p.appendChild(span);

          const ipaP = document.createElement("p");
          ipaP.className =
            "card-text text-muted small mt-auto pt-2 mb-0 border-top";
          const ipaStrong = document.createElement("strong");
          ipaStrong.textContent = "IPA: ";
          ipaP.appendChild(ipaStrong);
          const ipaSpan = document.createElement("span");
          ipaSpan.textContent = w.ipa;
          ipaP.appendChild(ipaSpan);

          body.appendChild(title);
          body.appendChild(sub);
          body.appendChild(p);
          body.appendChild(ipaP);
          card.appendChild(body);
          col.appendChild(card);
          grid.appendChild(col);
        });

        count.textContent = `Showing ${list.length} word(s).`;
      }

      function renderPhrases() {
        const container = document.getElementById("phrasesContainer");
        container.innerHTML = "";

        dialoguesData.forEach((diag) => {
          const card = document.createElement("div");
          card.className = "card mb-3 shadow-sm";
          const header = document.createElement("div");
          header.className = "card-header bg-dark text-white fw-bold";
          header.textContent = diag.title;
          card.appendChild(header);

          const body = document.createElement("div");
          body.className = "card-body";

          if (diag.context) {
            const ctx = document.createElement("p");
            ctx.className = "text-muted small fst-italic mb-3";
            ctx.textContent = diag.context;
            body.appendChild(ctx);
          }

          if (diag.status === "coming later" || diag.pages === "57-58") {
            const alert = document.createElement("div");
            alert.className = "alert alert-warning mb-0 text-center fw-bold";
            alert.textContent = "Coming later (Pages 57–58 under construction)";
            body.appendChild(alert);
          } else if (diag.turns) {
            const list = document.createElement("ul");
            list.className = "list-group list-group-flush";
            diag.turns.forEach((t) => {
              const li = document.createElement("li");
              li.className = "list-group-item py-2";

              const badge = document.createElement("span");
              badge.className = "badge bg-secondary me-2";
              badge.textContent = t.speaker || "Speaker";
              li.appendChild(badge);

              if (phraseMode === "both" || phraseMode === "ionian") {
                const ionSpan = document.createElement("span");
                ionSpan.className = "fw-bold text-primary me-2";
                ionSpan.textContent = t.ionian;
                li.appendChild(ionSpan);
              }

              if (phraseMode === "both" && t.english) {
                const sepSpan = document.createElement("span");
                sepSpan.className = "fw-bold me-2";
                sepSpan.textContent = "-";
                li.appendChild(sepSpan);
              }

              if (phraseMode === "both" || phraseMode === "english") {
                const engSpan = document.createElement("span");
                engSpan.className = "fw-bold me-2";
                engSpan.textContent = t.english;
                li.appendChild(engSpan);
              }
              list.appendChild(li);
            });
            body.appendChild(list);
          }
          card.appendChild(body);
          container.appendChild(card);
        });
      }

      document.getElementById("wordSearch").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        const filtered = wordsData.filter(
          (w) =>
            (w.ionian && w.ionian.toLowerCase().includes(q)) ||
            (w.english && w.english.toLowerCase().includes(q)) ||
            (w.notes && w.notes.toLowerCase().includes(q))
        );
        renderWords(filtered);
      });

      document.querySelectorAll("input[name='phraseLang']").forEach((r) => {
        r.addEventListener("change", (e) => {
          phraseMode = e.target.value;
          renderPhrases();
        });
      });

      initializeHub();
    </script>
  </body>
</html>
